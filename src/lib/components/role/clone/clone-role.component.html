<div #formContainer>
  <p class="text-muted small">
    Creates a new role with every permission <strong>{{ source()?.displayName || source()?.name }}</strong> holds that can be
    given to it. <strong>{{ source()?.displayName || source()?.name }}</strong> itself is not changed.
  </p>

  <app-alert *ngIf="failure() as failed" kind="danger" title="Nothing was created" icon="fa-solid fa-circle-exclamation" [details]="failed.details" display="expanded">
    {{ failed.message }}
  </app-alert>

  <form novalidate autocomplete="off" [formGroup]="formGroup" (ngSubmit)="save()">
    <div class="form-group required">
      <with-validation>
        <label class="form-label">Display Name</label>
        <input validate type="text" formControlName="displayName" class="form-control" placeholder="Display Name" required />
      </with-validation>
    </div>
    <div class="form-group required mt-2">
      <with-validation>
        <label class="form-label">Name</label>
        <input validate type="text" formControlName="name" class="form-control" placeholder="e.g. storemanager" noWhiteSpace required />
      </with-validation>
      <small class="text-muted">Letters only, 2 to 20 characters. Saved in lower case.</small>
    </div>
    <div class="form-group mt-2">
      <with-validation>
        <label class="form-label">Description</label>
        <textarea validate formControlName="description" class="form-control" rows="3"></textarea>
      </with-validation>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-3">
      <button type="button" class="btn btn-light" (click)="dismiss()" [disabled]="busy()">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="formGroup.invalid || busy()">
        <span *ngIf="busy()" class="spinner-border spinner-border-sm me-1"></span>
        <i *ngIf="!busy()" class="fa-solid fa-clone me-1"></i>Clone
      </button>
    </div>
  </form>
</div>
