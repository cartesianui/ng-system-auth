<default-actions
  (save)="onSave()"
  [disabled]="{
    save: formGroup.invalid || !formGroup.dirty
  }"
>
  <!-- Attach sends what is picked in Attach Permissions; Revoke sends what is ticked in Current Permissions. -->
  <action-menu-item icon="fa-solid fa-link" [disabled]="permissionsToAttach?.length < 1" (select)="onAttach()">
    Attach
  </action-menu-item>
  <action-menu-item icon="fa-solid fa-ban" [disabled]="permissionsToRevoke?.length < 1" (select)="onRevoke()">
    Revoke
  </action-menu-item>
  <action-menu-item *ngIf="canCloneRole && role()?.id" icon="fa-solid fa-clone" (select)="openCloneDialog()">
    Clone&hellip;
  </action-menu-item>
</default-actions>

<app-offcanvas
  id="role-clone"
  title="Clone role"
  [visible]="cloneDialogOpen()"
  (visibleChange)="cloneDialogOpen.set($event)"
>
  <auth-clone-role
    *ngIf="cloneDialogOpen() && cloneSource() as source"
    [source]="source"
    (cloned)="onCloned($event)"
    (dismissed)="cloneDialogOpen.set(false)"
  ></auth-clone-role>
</app-offcanvas>

<ng-container *ngIf="cloneSkipped() as clone">
  <app-alert
    *ngIf="clone.skipped.length; else clonedAll"
    kind="warning"
    icon="fa-solid fa-triangle-exclamation"
    [title]="clone.skipped.length + ' permission(s) of ' + clone.sourceName + ' were not copied'"
    [details]="skippedDetails(clone.skipped)"
    display="expanded"
  >
    The new role was created with every other permission. The server refused each one below, for the reason given.
  </app-alert>
  <ng-template #clonedAll>
    <app-alert kind="success" icon="fa-solid fa-clone">Cloned from {{ clone.sourceName }} with all of its permissions.</app-alert>
  </ng-template>
</ng-container>
<div class="main-content">
  <form novalidate autocomplete="off" [formGroup]="formGroup">
    <div class="card">
      <div class="card-header">
        <strong>Role Details</strong>
      </div>
      <div class="card-body">
        <div class="row g-2">
          <div class="col-md-6">
            <div class="form-group required">
              <with-validation>
                <label class="form-label">Name</label>
                <input validate type="text" formControlName="name" class="form-control" placeholder="Name" noWhiteSpace required />
              </with-validation>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group required">
              <with-validation>
                <label class="form-label">Display Name</label>
                <input validate type="text" formControlName="displayName" class="form-control" placeholder="Display Name" required />
              </with-validation>
            </div>
          </div>
          <div class="col-12">
            <div class="form-group required">
              <with-validation>
                <label class="form-label">Description</label>
                <textarea validate type="text" formControlName="description" class="form-control" rows="2" required></textarea>
              </with-validation>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-2 mt-0">
      <div class="col-lg-8">
        <div class="card mt-2">
          <div class="card-header">
            <strong>Current Permissions</strong>
          </div>
          <div class="card-body">
            <permissions-list [rows]="role()?.permissions?.data" [(selected)]="permissionsToRevoke"></permissions-list>
          </div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card mt-2">
          <div class="card-header">
            <strong>Attach Permissions</strong>
          </div>
          <div class="card-body">
            <div class="form-group">
              <lookup-widget [options]="permissionLookupOptions()" [ignoreOptions]="role()?.permissions?.data" [(selected)]="permissionsToAttach">
                <small>Select permissions to attach</small>
              </lookup-widget>
            </div>
          </div>
        </div>
        <auth-role-report-access *ngIf="canEditRoleGrants" [role]="role()"></auth-role-report-access>
      </div>
    </div>
  </form>
</div>
