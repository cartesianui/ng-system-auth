<default-actions
  (save)="onSave()"
  (attach)="onAttach()"
  (revoke)="onRevoke()"
  [disabled]="{
    save: formGroup.invalid || !formGroup.dirty,
    attach: permissionsToAttach?.length < 1,
    revoke: permissionsToRevoke?.length < 1
  }"
></default-actions>
<div class="main-content">
  <form novalidate autocomplete="off" [formGroup]="formGroup">
    <div class="row">
      <div class="col-md-4">
        <div class="card">
          <div class="card-header">
            <strong>Role Details</strong>
          </div>
          <div class="card-body">
            <div class="form-group required">
              <with-validation>
                <label class="form-label">Name</label>
                <input validate type="text" formControlName="name" class="form-control" placeholder="Name" noWhiteSpace required />
              </with-validation>
            </div>
            <div class="form-group required mt-2">
              <with-validation>
                <label class="form-label">Display Name</label>
                <input validate type="text" formControlName="displayName" class="form-control" placeholder="Display Name" required />
              </with-validation>
            </div>
            <div class="form-group required mt-2">
              <with-validation>
                <label class="form-label">Description</label>
                <textarea validate type="text" formControlName="description" class="form-control" rows="3" required></textarea>
              </with-validation>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-8">
        <div class="card">
          <div class="card-header">
            <strong>Attach Permissions</strong>
          </div>
          <div class="card-body">
            <div class="form-group">
              <lookup-widget [options]="permissionLookupOptions()" [ignoreOptions]="role()?.permissions?.data" [(selected)]="permissionsToAttach">
                <small>Select permissions to attach</small>
              </lookup-widget>
            </div>
          </div>
        </div>
        <div class="card mt-2">
          <div class="card-header">
            <strong>Current Permissions</strong>
            <small class="float-end text-muted">{{ role()?.permissions?.data?.length ?? 0 }} assigned</small>
          </div>
          <div class="card-body">
            <permissions-list [rows]="role()?.permissions?.data" [(selected)]="permissionsToRevoke"></permissions-list>
          </div>
        </div>
        <auth-role-report-access *ngIf="canEditRoleGrants" [role]="role()"></auth-role-report-access>
      </div>
    </div>
  </form>
</div>
