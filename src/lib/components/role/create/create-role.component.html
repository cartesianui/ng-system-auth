<default-actions
  (save)="save()"
  [disabled]="{
    save: formGroup.invalid
  }"
></default-actions>
<div class="main-content">
  <form novalidate autocomplete="off" [formGroup]="formGroup">
    <div class="card">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-xl-6 d-flex flex-column gap-3">
            <div class="form-panel">
              <h6 class="form-panel-title">Identity</h6>
              <div class="row g-3">
                <div class="col-md-6">
                  <div class="form-group required">
                    <with-validation>
                      <label class="form-label">Name</label>
                      <input validate formControlName="name" class="form-control" placeholder="e.g. admin, editor" noWhiteSpace required/>
                    </with-validation>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group required">
                    <with-validation>
                      <label class="form-label">Display Name</label>
                      <input validate formControlName="displayName" class="form-control" placeholder="e.g. Administrator, Content Editor" required />
                    </with-validation>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-xl-6 d-flex flex-column gap-3">
            <div class="form-panel">
              <h6 class="form-panel-title">Details</h6>
              <div class="row g-3">
                <div class="col-12">
                  <div class="form-group required">
                    <with-validation>
                      <label class="form-label">Description</label>
                      <textarea validate formControlName="description" class="form-control" rows="3" placeholder="Describe what this role can do..." required></textarea>
                    </with-validation>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
