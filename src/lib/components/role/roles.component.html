<page-title [title]="'Roles'" [breadcrumb]="true"></page-title>
<page-actions
  (delete)="onDelete()"
  (create)="showChildComponent(childComponents.createRole, 'createRole')"
  [disabled]="{
    delete: selected.length !== 1
  }"
></page-actions>

<!-- Edit holds the role fields, its permissions and Report access side by side, so it gets the room; Create keeps the default width. -->
<app-offcanvas
  id="role-forms"
  [title]="childComponentSelected && childComponentSelected?.title"
  [width]="isComponentSelected(childComponents.editRole) ? 'min(1280px, 95vw)' : undefined"
  [visible]="childSelected"
  (visibleChange)="hideChildComponent($event)"
>
  <auth-create-role *ngIf="isComponentSelected(childComponents.createRole)" (created)="onCreated()" />
  <auth-edit-role *ngIf="isComponentSelected(childComponents.editRole)" />
</app-offcanvas>

<div class="main-content dt" #dtContainer>
  <search-panel [fields]="searchFields" [criteria]="criteria" searchKey="name" searchPlaceholder="Search roles..."></search-panel>
  <div class="card">
    <div class="card-body">
      <app-datatable
        [rows]="sb.role.entities()"
        [columns]="columns"
        [headers]="headers"
        [count]="sb.role.pagination()?.total"
        [offset]="getOffsetFromPagination()"
        [limit]="sb.role.pagination()?.perPage"
        [selected]="selected"
        [rowHeight]="'auto'"
        (selectChange)="onSelect($event)"
        (pageChange)="setPage($event)"
        (editClick)="edit($event)"
      ></app-datatable>
    </div>
  </div>
</div>
